services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      # Names and addresses displays use to reach this server, added to the TLS
      # certificate created on first start (the container can't see the host's LAN IP).
      # CERT_HOSTS: 'infoscreen.lan,192.168.1.10'
    restart: unless-stopped
